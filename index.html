<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Johan's Quest: Pixel Realm</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 { margin-bottom: 10px; font-size: 24px; text-shadow: 2px 2px #000; }
        #gameCanvas {
            border: 4px solid #ffffff;
            background-color: #5c94fc;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.5);
        }
        .controls-info { margin-top: 15px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>

    <h1>🎮 Johan's Quest: Pixel Realm</h1>
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    <div class="controls-info">Usa A / D para moverte, Shift para correr, Espacio para Saltar</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Función para cargar imagen y remover fondo blanco automáticamente
        function loadSprite(src) {
            const img = new Image();
            img.src = src;
            img.onload = () => {
                const offscreenCanvas = document.createElement('canvas');
                offscreenCanvas.width = img.width;
                offscreenCanvas.height = img.height;
                const offCtx = offscreenCanvas.getContext('2d');
                offCtx.drawImage(img, 0, 0);

                const imgData = offCtx.getImageData(0, 0, img.width, img.height);
                const data = imgData.data;

                // Eliminar color blanco (R: 250+, G: 250+, B: 250+)
                for (let i = 0; i < data.length; i += 4) {
                    if (data[i] > 240 && data[i+1] > 240 && data[i+2] > 240) {
                        data[i+3] = 0; // Transparencia total
                    }
                }
                offCtx.putImageData(imgData, 0, 0);
                img.cleanCanvas = offscreenCanvas;
            };
            return img;
        }

        // Cargar assets
        const sprites = {
            idle: loadSprite('johancito idle.gif'),
            walkRight: loadSprite('Johancito-walking.gif'),
            walkLeft: loadSprite('johancito-walking-left.gif'),
            runRight: loadSprite('Johancito-running.gif'),
            runLeft: loadSprite('johancito-running-left.gif'),
            grass: loadSprite('grass.png'),
            soil: loadSprite('soil.png'),
            slime: loadSprite('slime.gif')
        };

        const tileSize = 32;
        const groundY = canvas.height - (tileSize * 2);

        // Estado del jugador con físicas de salto
        const player = {
            x: 100,
            y: groundY - 48,
            width: 48,
            height: 48,
            speed: 3,
            vx: 0,
            vy: 0,
            gravity: 0.5,
            jumpPower: -10,
            isGrounded: false,
            direction: 'idle'
        };

        const keys = {};
        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

        function update() {
            let isRunning = keys['Shift'];
            let currentSpeed = isRunning ? player.speed * 1.8 : player.speed;

            // Movimiento Horizontal
            if (keys['a'] || keys['A'] || keys['ArrowLeft']) {
                player.vx = -currentSpeed;
                player.direction = isRunning ? 'runLeft' : 'walkLeft';
            } else if (keys['d'] || keys['D'] || keys['ArrowRight']) {
                player.vx = currentSpeed;
                player.direction = isRunning ? 'runRight' : 'walkRight';
            } else {
                player.vx = 0;
                player.direction = 'idle';
            }

            // Salto
            if ((keys[' '] || keys['w'] || keys['W'] || keys['ArrowUp']) && player.isGrounded) {
                player.vy = player.jumpPower;
                player.isGrounded = false;
            }

            // Aplicar gravedad
            player.vy += player.gravity;
            player.x += player.vx;
            player.y += player.vy;

            // Colisión con el suelo real
            if (player.y + player.height >= groundY) {
                player.y = groundY - player.height;
                player.vy = 0;
                player.isGrounded = true;
            }

            // Limites del Canvas
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
        }

        function drawCleanImage(imgObj, x, y, w, h) {
            if (imgObj.cleanCanvas) {
                ctx.drawImage(imgObj.cleanCanvas, x, y, w, h);
            } else if (imgObj.complete) {
                ctx.drawImage(imgObj, x, y, w, h);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Dibujar Mapa
            for (let x = 0; x < canvas.width; x += tileSize) {
                drawCleanImage(sprites.grass, x, canvas.height - tileSize * 2, tileSize, tileSize);
                drawCleanImage(sprites.soil, x, canvas.height - tileSize, tileSize, tileSize);
            }

            // Dibujar Slime
            drawCleanImage(sprites.slime, 500, groundY - 32, 32, 32);

            // Dibujar Jugador según estado
            let currentSprite = sprites[player.direction] || sprites.idle;
            drawCleanImage(currentSprite, player.x, player.y, player.width, player.height);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        window.onload = () => gameLoop();
    </script>
</body>
</html>
