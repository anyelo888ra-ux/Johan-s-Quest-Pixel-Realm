<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Johan's Quest: Pixel Realm</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
        }
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 18px;
            text-shadow: 2px 2px 0px #000;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="ui-layer">
        <div id="levelDisplay">Nivel: 1</div>
        <div id="healthDisplay">Vida: ❤️❤️❤️</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- SISTEMA DE AUDIO RETRO EN TIEMPO REAL (Web Audio API) ---
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                startRetroMusic();
            }
        }

        // Efecto de Sonido de Salto
        function playJumpSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        // Música de Fondo Estilo Chiptune 8-Bit
        function startRetroMusic() {
            const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25]; // Do Re Mi Fa Sol La Si Do
            let step = 0;

            setInterval(() => {
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                // Melodía simple
                const note = notes[step % notes.length];
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(note, audioCtx.currentTime);
                
                gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
                step++;
            }, 250);
        }

        // Carga de Sprites con fondo transparente
        function loadSprite(src) {
            const img = new Image();
            img.src = src;
            img.onload = () => {
                const offCanvas = document.createElement('canvas');
                offCanvas.width = img.width;
                offCanvas.height = img.height;
                const offCtx = offCanvas.getContext('2d');
                offCtx.drawImage(img, 0, 0);
                const imgData = offCtx.getImageData(0, 0, img.width, img.height);
                const data = imgData.data;

                for (let i = 0; i < data.length; i += 4) {
                    if (data[i] > 240 && data[i+1] > 240 && data[i+2] > 240) {
                        data[i+3] = 0;
                    }
                }
                offCtx.putImageData(imgData, 0, 0);
                img.cleanCanvas = offCanvas;
            };
            return img;
        }

        const sprites = {
            idle: loadSprite('johancito idle.gif'),
            walkRight: loadSprite('Johancito-walking.gif'),
            walkLeft: loadSprite('johancito-walking-left.gif'),
            runRight: loadSprite('Johancito-running.gif'),
            runLeft: loadSprite('johancito-running-left.gif'),
            grass: loadSprite('grass.png'),
            soil: loadSprite('soil.png'),
            rock: loadSprite('rock.png'),
            slime: loadSprite('slime.gif')
        };

        const tileSize = 48;
        let currentLevel = 1;

        const levels = {
            1: {
                platforms: [
                    { x: 300, y: canvas.height - tileSize * 4, w: 3, h: 1 },
                    { x: 550, y: canvas.height - tileSize * 6, w: 4, h: 1 }
                ],
                slimes: [
                    { x: 500, y: canvas.height - tileSize * 2 - 40, width: 40, height: 40, vx: 2, minX: 350, maxX: 700 }
                ]
            },
            2: {
                platforms: [
                    { x: 200, y: canvas.height - tileSize * 4, w: 2, h: 1 },
                    { x: 450, y: canvas.height - tileSize * 6, w: 2, h: 1 },
                    { x: 700, y: canvas.height - tileSize * 8, w: 3, h: 1 }
                ],
                slimes: [
                    { x: 250, y: canvas.height - tileSize * 4 - 40, width: 40, height: 40, vx: 3, minX: 200, maxX: 300 },
                    { x: 600, y: canvas.height - tileSize * 2 - 40, width: 40, height: 40, vx: 4, minX: 450, maxX: 850 }
                ]
            }
        };

        const player = {
            x: 50,
            y: 100,
            width: 48,
            height: 48,
            speed: 4,
            vx: 0,
            vy: 0,
            gravity: 0.6,
            jumpPower: -12,
            isGrounded: false,
            direction: 'idle',
            hp: 3,
            invulnerable: 0
        };

        const keys = {};
        window.addEventListener('keydown', e => {
            initAudio(); // Inicia el audio al presionar cualquier tecla
            keys[e.key] = true;
        });
        window.addEventListener('keyup', e => keys[e.key] = false);

        function resetPlayer() {
            player.x = 50;
            player.y = canvas.height - tileSize * 3;
            player.vx = 0;
            player.vy = 0;
        }

        function checkAABB(a, b) {
            return a.x < b.x + b.width &&
                   a.x + a.width > b.x &&
                   a.y < b.y + b.height &&
                   a.y + a.height > b.y;
        }

        function update() {
            let isRunning = keys['Shift'];
            let currentSpeed = isRunning ? player.speed * 1.7 : player.speed;

            if (keys['a'] || keys['A'] || keys['ArrowLeft']) {
                player.vx = -currentSpeed;
                player.direction = isRunning ? 'runLeft' : 'walkLeft';
            } else if (keys['d'] || keys['D'] || keys['ArrowRight']) {
                player.vx = currentSpeed;
                player.direction = isRunning ? 'runRight' : 'walkRight';
            } else {
                player.vx = 0;
                player.direction = 'idle';
            }

            if ((keys[' '] || keys['w'] || keys['W'] || keys['ArrowUp']) && player.isGrounded) {
                player.vy = player.jumpPower;
                player.isGrounded = false;
                playJumpSound();
            }

            player.vy += player.gravity;
            player.x += player.vx;
            player.y += player.vy;

            // Colisión Suelo
            const groundY = canvas.height - tileSize * 2;
            if (player.y + player.height >= groundY) {
                player.y = groundY - player.height;
                player.vy = 0;
                player.isGrounded = true;
            }

            // Colisión Plataformas
            const level = levels[currentLevel];
            level.platforms.forEach(plat => {
                const px = plat.x;
                const py = plat.y;
                const pw = plat.w * tileSize;

                if (player.x + player.width > px && player.x < px + pw) {
                    if (player.y + player.height >= py && player.y + player.height <= py + 15 && player.vy >= 0) {
                        player.y = py - player.height;
                        player.vy = 0;
                        player.isGrounded = true;
                    }
                }
            });

            // Transición de Nivel
            if (player.x + player.width >= canvas.width) {
                if (levels[currentLevel + 1]) {
                    currentLevel++;
                    document.getElementById('levelDisplay').innerText = `Nivel: ${currentLevel}`;
                    resetPlayer();
                } else {
                    player.x = canvas.width - player.width;
                }
            }
            if (player.x < 0) player.x = 0;

            // Enemigos
            if (player.invulnerable > 0) player.invulnerable--;

            level.slimes.forEach(slime => {
                slime.x += slime.vx;
                if (slime.x <= slime.minX || slime.x + slime.width >= slime.maxX) {
                    slime.vx *= -1;
                }

                if (checkAABB(player, slime) && player.invulnerable === 0) {
                    player.hp--;
                    player.invulnerable = 60;
                    document.getElementById('healthDisplay').innerText = `Vida: ${'❤️'.repeat(Math.max(0, player.hp))}`;
                    if (player.hp <= 0) {
                        alert('¡Game Over! Reintentando...');
                        player.hp = 3;
                        currentLevel = 1;
                        document.getElementById('levelDisplay').innerText = `Nivel: 1`;
                        document.getElementById('healthDisplay').innerText = `Vida: ❤️❤️❤️`;
                        resetPlayer();
                    }
                }
            });
        }

        function drawCleanImage(imgObj, x, y, w, h) {
            if (imgObj.cleanCanvas) {
                ctx.drawImage(imgObj.cleanCanvas, x, y, w, h);
            } else if (imgObj.complete) {
                ctx.drawImage(imgObj, x, y, w, h);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Fondo
            ctx.fillStyle = '#5c94fc';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Suelo
            for (let x = 0; x < canvas.width; x += tileSize) {
                drawCleanImage(sprites.grass, x, canvas.height - tileSize * 2, tileSize, tileSize);
                drawCleanImage(sprites.soil, x, canvas.height - tileSize, tileSize, tileSize);
            }

            const level = levels[currentLevel];

            // Plataformas
            level.platforms.forEach(plat => {
                for (let i = 0; i < plat.w; i++) {
                    drawCleanImage(sprites.rock, plat.x + i * tileSize, plat.y, tileSize, tileSize);
                }
            });

            // Slimes
            level.slimes.forEach(slime => {
                drawCleanImage(sprites.slime, slime.x, slime.y, slime.width, slime.height);
            });

            // Jugador
            if (player.invulnerable % 10 < 5) {
                let currentSprite = sprites[player.direction] || sprites.idle;
                drawCleanImage(currentSprite, player.x, player.y, player.width, player.height);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        window.onload = () => {
            resetPlayer();
            gameLoop();
        };
    </script>
</body>
</html>
